<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContextShare</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17171b; color: #ececef; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100% - 2rem, 34rem); padding: 2rem; background: #27272e; border-radius: 1rem; }
    p { line-height: 1.55; color: #b4b4c1; }
    h1 { margin: 0.5rem 0; font-size: clamp(2rem, 8vw, 3rem); overflow-wrap: anywhere; }
    .status { font-size: 0.9rem; color: #b9a8ff; }
  </style>
</head>
<body>
  <main>
    <span class="status">Проект в подготовке</span>
    <h1>ContextShare</h1>
    <p>Структурированная база знаний проекта для людей и ИИ.</p>
  </main>
</body>
</html>
